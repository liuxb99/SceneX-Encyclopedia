name: Validate encyclopedia gallery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate embedded gallery
        run: python scripts/validate_gallery_publish.py

      - name: Test publication readiness contract
        run: python -m unittest discover -s scripts -p test_validate_gallery_publish.py -v
