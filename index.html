function selectFamily(fam){document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("active",b.dataset.f===fam));const meta=familyMeta(fam);$("#familyTitle").textContent=meta?.label_zh||fam;const es=entries.filter(e=>e.family===fam);const groups=[...new Set(es.map(e=>e.group))];$("#groups").innerHTML=groups.length?groups.map(g=>'<div><div class="muted" style="margin:12px 0 5px">'+(es.find(e=>e.group===g)?.group_label_zh||g)+'</div>'+es.filter(e=>e.group===g).map(e=>'<button class="pill" data-id="'+e.class_id+'">'+e.label_zh+'</button>').join("")+'</div>').join(""):'<div class="empty">尚無已發布建模成果</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>selectEntry(b.dataset.id));if(es[0])selectEntry(es[0].class_id);else{selected=assets=null;render()}}
async function selectEntry(id){selected=entries.find(e=>e.class_id===id);view=0;assets=EMBEDDED_ASSETS[id];document.querySelectorAll("[data-id]").forEach(b=>b.classList.toggle("active",b.dataset.id===id));render()}
function render(){if(!assets){$("#stage").innerHTML='<div class="empty"><div><b>'+(selected?.label_zh||"百科條目")+'</b><br><span class="muted">Executable Class 已建立 · 視覺成果待發布</span></div></div>';$("#info").innerHTML='<h2>'+(selected?.label_zh||"—")+'</h2><div class="kv"><span class="muted">Class</span><b>'+(selected?.class_id||"—")+'</b><span class="muted">狀態</span><b>'+(selected?.status||"—")+'</b><span class="muted">Source</span><b>'+(selected?.class_path||"—")+'</b></div><p class="muted">此入口已納入百科；production geometry / visual QA 圖片完成發布後會直接顯示於此。</p>';return}const raw=assets.assets||[],order=assets.display_order||[],rank=new Map(order.map((r,i)=>[r,i])),aa=[...raw].sort((a,b)=>(rank.get(a.role)??9999)-(rank.get(b.role)??9999)),a=aa[view]||aa[0];$("#stage").innerHTML='<img class="hero" src="'+a.secure_url+'" alt="'+a.role+'" data-role="'+a.role+'"><div class="thumbs">'+aa.map((x,n)=>'<div class="thumb '+(n===view?"active":"")+'" data-v="'+n+'"><img src="'+x.secure_url+'" loading="lazy" alt="'+x.role+'"><small>'+x.role+'</small></div>').join("")+'</div>';document.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>{view=+e.dataset.v;render()});const un=(selected?.unresolved_items||[]).length;const unTxt=un?un+' 項（缺工程 authority，不猜測）':'無';$("#info").innerHTML='<h2>'+selected.label_zh+'</h2><div class="kv"><span class="muted">Class</span><b>'+assets.class_id+'</b><span class="muted">Version</span><b>'+assets.class_version+'</b><span class="muted">View</span><b>'+a.role+'</b><span class="muted">IFC</span><b>'+(selected?.ifc_predefined_type||"—")+'</b><span class="muted">Dual Tree</span><b>'+(selected?.dual_tree_status||"—")+'</b><span class="muted">Sensitivity</span><b>'+(selected?.sensitivity_status||"—")+'</b><span class="muted">參數數</span><b>'+(selected?.parameter_count??"—")+'</b><span class="muted">UNRESOLVED</span><b>'+unTxt+'</b><span class="muted">Revision</span><b>'+(assets.visual_qa_revision||"—")+'</b><span class="muted">Commit</span><b>'+((assets.generated_from_commit||"—").slice(0,8))+'</b><span class="muted">使⽤者</span><b>'+((assets.display_order||[]).join(" · "))+'</b></div><h3>建模特徵</h3><ul>'+(assets.construction_features||[]).map(x=>'<li>'+x+'</li>').join("")+'</ul><p class="muted">圖片是衍生 QA；Python Class / geometry provider 為建模 authority。</p>'}boot().catch(e=>{$("#stage").innerHTML='<div class="empty">Gallery 載入失敗：'+e.message+'</div>'})
</script></body></html>
