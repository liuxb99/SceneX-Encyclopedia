async function boot(){idx=EMBEDDED_INDEX;reg=EMBEDDED_REGISTRY;entries=reg.entries||[];renderFamilies();const fam=entries[0]?.family||idx.families[0]?.path.split("/")[1];selectFamily(fam)}
function familyMeta(id){return idx.families.find(x=>x.path==="wikipedia/"+id+"/")}
function renderFamilies(){const ready=new Set(entries.map(e=>e.family));$("#families").innerHTML=idx.families.map(f=>{const id=f.path.split("/")[1];return '<button class="pill '+(ready.has(id)?"":"muted")+'" data-f="'+id+'">'+f.label_zh+'</button>'}).join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>selectFamily(b.dataset.f))}
function selectFamily(fam){document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("active",b.dataset.f===fam));const meta=familyMeta(fam);$("#familyTitle").textContent=meta?.label_zh||fam;const es=entries.filter(e=>e.family===fam);const groups=[...new Set(es.map(e=>e.group))];$("#groups").innerHTML=groups.length?groups.map(g=>'<div><div class="muted" style="margin:12px 0 5px">'+(es.find(e=>e.group===g)?.group_label_zh||g)+'</div>'+es.filter(e=>e.group===g).map(e=>'<button class="pill" data-id="'+e.class_id+'">'+e.label_zh+'</button>').join("")+'</div>').join(""):'<div class="empty">尚無已發布建模成果</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>selectEntry(b.dataset.id));if(es[0])selectEntry(es[0].class_id);else{selected=assets=null;render()}}
async function selectEntry(id){selected=entries.find(e=>e.class_id===id);view=0;assets=EMBEDDED_ASSETS[id];document.querySelectorAll("[data-id]").forEach(b=>b.classList.toggle("active",b.dataset.id===id));render()}
// ---- generic Golden Class asset normaliser -------------------------------
// Bridge manifests are single-variant (`assets` + `display_order`); road
// manifests are multi-variant (`variants[].views[]`). Normalising both here
// keeps ONE gallery UI for every Golden Class family instead of a second site.
function assetVariants(manifest){
  if(!manifest) return [];
  if(manifest.variants) return manifest.variants.map(v=>({
    variant:v.variant, parameters:v.parameters, views:(v.views||[]).map(x=>({
      role:x.role, purpose:x.purpose,
      url:x.public_url||x.secure_url||null,
      publicUrl:!!x.public_url, bytes:x.bytes, format:x.format||null
    }))
  }));
  const order=manifest.display_order||[], rank=new Map(order.map((r,i)=>[r,i]));
  const items=(manifest.assets||[]).map(x=>({
    role:x.role, purpose:x.purpose, url:x.secure_url||x.public_url||null,
    publicUrl:!!x.secure_url, bytes:x.bytes, format:x.format||null
  })).sort((a,b)=>(rank.get(a.role)??9999)-(rank.get(b.role)??9999));
  return items.length?[{variant:manifest.visual_qa_revision||"default", parameters:null, views:items}]:[];
}
function viewGroup(x){
  return (x?.format==="svg" || String(x?.role||"").startsWith("engineering_"))
    ? "engineering" : "visual";
}
function groupedThumbs(views,current){
  const groups=[["visual","3D Visual QA"],["engineering","Engineering SVG"]];
  return groups.map(([kind,label])=>{
    const members=views.map((x,n)=>({x,n})).filter(o=>viewGroup(o.x)===kind);
    if(!members.length) return "";
    return '<div class="view-group" data-view-group="'+kind+'">'
      +'<div class="muted" style="font-weight:700;margin:14px 0 8px">'+label+'</div>'
      +'<div class="thumbs">'
      +members.map(({x,n})=>'<div class="thumb '+(n===current?"active":"")+'" data-v="'+n+'">'
        +'<img src="'+x.url+'" loading="lazy" alt="'+x.role+'">'
        +'<small>'+x.role+'</small></div>').join("")
      +'</div></div>';
  }).join("");
}
let variantIndex=0;
function selectVariant(i){variantIndex=i;view=0;render()}
function render(){if(!assets){$("#stage").innerHTML='<div class="empty"><div><b>'+(selected?.label_zh||"百科條目")+'</b><br><span class="muted">Executable Class 已建立 · 視覺成果待發布</span></div></div>';$("#info").innerHTML='<h2>'+(selected?.label_zh||"—")+'</h2><div class="kv"><span class="muted">Class</span><b>'+(selected?.class_id||"—")+'</b><span class="muted">狀態</span><b>'+(selected?.status||"—")+'</b><span class="muted">Source</span><b>'+(selected?.class_path||"—")+'</b></div><p class="muted">此入口已納入百科；production geometry / visual QA 圖片完成發布後會直接顯示於此。</p>';return}const vv=assetVariants(assets);if(!vv.length){$("#stage").innerHTML='<div class="empty">此 Class 尚無已發布視覺成果</div>';return}if(variantIndex>=vv.length)variantIndex=0;const cur=vv[variantIndex],aa=cur.views,a=aa[view]||aa[0];$("#stage").innerHTML='<img class="hero" src="'+a.url+'" alt="'+a.role+'" data-role="'+a.role+'">'+groupedThumbs(aa,view);document.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>{view=+e.dataset.v;render()});
