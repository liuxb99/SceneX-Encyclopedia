":"png"},{"role":"foundation_iso","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/foundation_iso","secure_url":"https://res.cloudinary.com/zsxeu0gu/image/upload/v1791001162/scenex/wikipedia/bridge/pci/golden-candidate/r28/foundation_iso.png","version":1791001162,"bytes":13096,"format":"png"},{"role":"foundation_plan_top","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/foundation_plan_top","secure_url":"https://res.cloudinary.com/zsxeu0gu/image/upload/v1791001163/scenex/wikipedia/bridge/pci/golden-candidate/r28/foundation_plan_top.png","version":1791001163,"bytes":10419,"format":"png"},{"role":"foundation_side","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/foundation_side","secure_url":"https://res.cloudinary.com/zsxeu0gu/image/upload/v1791001163/scenex/wikipedia/bridge/pci/golden-candidate/r28/foundation_side.png","version":1791001163,"bytes":7392,"format":"png"},{"role":"caisson_closed_iso","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/caisson_closed_iso","secure_url":"https://res.cloudinary.com/zsxeu0gu/image/upload/v1791001164/scenex/wikipedia/bridge/pci/golden-candidate/r28/caisson_closed_iso.png","version":1791001164,"bytes":11964,"format":"png"},{"role":"caisson_closed_cutaway","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/caisson_closed_cutaway","secure_url":"https://res.cloudinary.com/zsxeu0gu/image/upload/v1791001165/scenex/wikipedia/bridge/pci/golden-candidate/r28/caisson_closed_cutaway.png","version":1791001165,"bytes":8478,"format":"png"},{"role":"caisson_well_iso","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/caisson_well_iso","secure_url":"https://res.cloudinary.com/zsxeu0gu/image/upload/v1791001165/scenex/wikipedia/bridge/pci/golden-candidate/r28/caisson_well_iso.png","version":1791001165,"bytes":16836,"format":"png"},{"role":"joint_detail","public_id":"scenex/wikipedia/bridge/pci/golden-candidate/r28/joint_detail","secure_url":"https://res.cloudinary.com/zsxeu let idx,reg,entries=[],selected=null,assets=null,view=0;const $=s=>document.querySelector(s);
async function boot(){idx=EMBEDDED_INDEX;reg=EMBEDDED_REGISTRY;entries=reg.entries||[];renderFamilies();const fam=entries[0]?.family||idx.families[0]?.path.split("/")[1];selectFamily(fam)}
function familyMeta(id){return idx.families.find(x=>x.path==="wikipedia/"+id+"/")}
function renderFamilies(){const ready=new Set(entries.map(e=>e.family));$("#families").innerHTML=idx.families.map(f=>{const id=f.path.split("/")[1];return '<button class="pill '+(ready.has(id)?"":"muted")+'" data-f="'+id+'">'+f.label_zh+'</button>'}).join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>selectFamily(b.dataset.f))}
function selectFamily(fam){document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("active",b.dataset.f===fam));const meta=familyMeta(fam);$("#familyTitle").textContent=meta?.label_zh||fam;const es=entries.filter(e=>e.family===fam);const groups=[...new Set(es.map(e=>e.group))];$("#groups").innerHTML=groups.length?groups.map(g=>'<div><div class="muted" style="margin:12px 0 5px">'+(es.find(e=>e.group===g)?.group_label_zh||g)+'</div>'+es.filter(e=>e.group===g).map(e=>'<button class="pill" data-id="'+e.class_id+'">'+e.label_zh+'</button>').join("")+'</div>').join(""):'<div class="empty">尚無已發布建模成果</div>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>selectEntry(b.dataset.id));if(es[0])selectEntry(es[0].class_id);else{selected=assets=null;render()}}
async function selectEntry(id){selected=entries.find(e=>e.class_id===id);view=0;assets=EMBEDDED_ASSETS[id];document.querySelectorAll("[data-id]").forEach(b=>b.classList.toggle("active",b.dataset.id===id));render()}
function render(){if(!assets){$("#stage").innerHTML='<div class="empty">選擇有建模成果的百科條目</div>';$("#info").innerHTML='<div class="muted">Gallery 只顯示已存在的真實成果。</div>';return}const raw=assets.assets||[],order=assets.display_order||[],rank=new Map(order.map((r,i)=>[r,i])),aa=[...raw].sort((a,b)=>(rank.get(a.role)??9999)-(rank.get(b.role)??9999)),a=aa[view]||aa[0];$("#stage").innerHTML='<img class="hero" src="'+a.secure_url+'" alt="'+a.role+'"><div class="thumbs">'+aa.map((x,n)=>'<div class="thumb '+(n===view?"active":"")+'" data-v="'+n+'"><img src="'+x.secure_url+'" loading="lazy"><small>'+x.role+'</small></div>').join("")+'</div>';document.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>{view=+e.dataset.v;render()});$("#info").innerHTML='<h2>'+selected.label_zh+'</h2><div class="kv"><span class="muted">Class</span><b>'+assets.class_id+'</b><span class="muted">Version</span><b>'+assets.class_version+'</b><span class="muted">Status</span><b>'+(assets.status||"—")+'</b><span class="muted">QA</span><b>'+(assets.visual_qa_scope?.status||"—")+'</b><span class="muted">Tests</span><b>'+(assets.verification?.tests||"—")+'</b><span class="muted">Views</span><b>'+(assets.verification?.canonical_views||"—")+'</b><span class="muted">Revision</span><b>'+(assets.visual_qa_revision||"—")+'</b><span class="muted">View</span><b>'+a.role+'</b></div><h3>建模特徵</h3><ul>'+(assets.construction_features||[]).map(x=>'<li>'+x+'</li>').join("")+'</ul><p class="muted">圖片是衍生 QA；Python Class / geometry provider 為建模 authority。</p>'}boot().catch(e=>{$("#stage").innerHTML='<div class="empty">Gallery 載入失敗：'+e.message+'</div>'})
</script></body></html>
