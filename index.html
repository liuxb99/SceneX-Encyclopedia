<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SceneX 可執行建模百科</title>
<style>:root{font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color-scheme:dark;background:#0b0e13;color:#e8edf5}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0}.head{padding:20px 26px;border-bottom:1px solid #252b35}.head h1{margin:0 0 5px;font-size:24px}.muted{color:#8f9bad}.bar{display:flex;gap:8px;overflow:auto;padding:12px 26px;border-bottom:1px solid #252b35}.pill{white-space:nowrap;border:1px solid #303846;background:#151a22;color:#cbd5e1;border-radius:9px;padding:8px 12px;cursor:pointer}.pill.active{background:#e8edf5;color:#0b0e13}.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:16px;padding:18px 26px}.panel{background:#11161e;border:1px solid #252b35;border-radius:13px;padding:13px;min-width:0}.entries button{display:block;width:100%;text-align:left;margin:5px 0}.hero{width:100%;height:min(62vh,700px);object-fit:contain;background:#090c10;border-radius:8px}.thumbs{display:flex;gap:8px;overflow:auto;padding-top:10px}.thumb{width:135px;flex:none;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer}.thumb.active{border-color:#e8edf5}.thumb img{width:100%;height:80px;object-fit:contain}.thumb small{display:block;padding:5px;overflow:hidden;text-overflow:ellipsis}.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:7px;font-size:14px;overflow-wrap:anywhere}.kv b{min-width:0;overflow-wrap:anywhere}.empty{height:55vh;display:grid;place-items:center;color:#7e8998}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:12px}.hero{height:45vh}.head,.bar{padding-left:14px;padding-right:14px}}</style><style>
.entries .pill{white-space:normal;overflow-wrap:anywhere}.hero-button{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.thumb{padding:0;background:#090c10;color:inherit;text-align:left}.entry-link{color:#a7c8ff;overflow-wrap:anywhere}#info h2,#info p{overflow-wrap:anywhere}#imageLightbox{width:min(96vw,1400px);max-width:96vw;max-height:96vh;border:1px solid #52617a;border-radius:12px;padding:14px;background:#11161e;color:#e8edf5}#imageLightbox::backdrop{background:#000c}#lightboxImage{display:block;width:100%;max-height:82vh;object-fit:contain}#closeLightbox{display:block;margin-left:auto;margin-bottom:10px;padding:8px 12px;border:1px solid #52617a;border-radius:7px;background:#151a22;color:inherit;cursor:pointer}#lightboxCaption{overflow-wrap:anywhere;margin:10px 0 0}.preview-card{width:180px;flex:none;max-width:70vw;padding:0;border:1px solid #303846;border-radius:7px;background:#090c10;color:inherit;cursor:zoom-in;overflow:hidden}.preview-image{display:block;width:100%;height:180px;object-fit:contain}.preview-card small{display:block;padding:7px}#animationPreviews p{overflow-wrap:anywhere}
</style></head>
<body><header class="head"><h1>SceneX 可執行建模百科</h1><div class="muted">統一視覺入口 · Python Class → Geometry → Visual QA</div></header><nav id="families" class="bar"></nav><div class="layout"><aside class="panel"><b id="familyTitle">百科條目</b><div id="groups" class="entries"></div></aside><main class="panel" id="stage"></main><aside class="panel" id="info"></aside></div>
<dialog id="imageLightbox" aria-label="成果大圖"><button type="button" id="closeLightbox" aria-label="關閉大圖">關閉 ×</button><img id="lightboxImage" alt=""><p id="lightboxCaption"></p></dialog>
<script>
// SceneX static viewer. Mutable gallery data lives only in JSON.
let idx=null,reg=null,entries=[],assets=null,selected=null,view=0,variantIndex=0;
let galleryAssets={};
async function loadJSON(path){const response=await fetch(path,{cache:"no-cache"});if(!response.ok)throw new Error(path+": HTTP "+response.status);return response.json()}
function escapeText(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function hashEntry(){const id=new URLSearchParams(window.location.hash.slice(1)).get("class");return entries.find(e=>e.class_id===id)}
function isCharacterEntry(entry){return entry?.family==="characters"||(entry?.family==="human_body"&&String(entry.class_id||"").startsWith("character."))}
async function boot(){const loaded=await Promise.all([loadJSON("_index.json"),loadJSON("gallery.json"),loadJSON("gallery_assets.json")]);idx=loaded[0];reg=loaded[1];galleryAssets=loaded[2];entries=reg.entries||[];renderFamilies();const target=hashEntry();const fam=target?.family||entries[0]?.family||idx.families[0]?.path.split("/")[1];selectFamily(fam,target?.class_id)}
function familyMeta(id){return idx.families.find(x=>x.path==="wikipedia/"+id+"/")}
function renderFamilies(){const ready=new Set(entries.map(e=>e.family));$("#families").innerHTML=idx.families.map(f=>{const id=f.path.split("/")[1];return '<button class="pill '+(ready.has(id)?"":"muted")+'" data-f="'+id+'">'+f.label_zh+'</button>'}).join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>selectFamily(b.dataset.f))}
function familyGroups(es,fam){
  const groups=new Map();
  for(const e of es){
    const group=e.group||"other", work=isCharacterEntry(e)?(e.source_work||galleryAssets[e.class_id]?.source_work||"來源作品未提供"):"";
    const key=JSON.stringify([group,work]);
    if(!groups.has(key))groups.set(key,{label:(e.group_label_zh||group)+(work?" ／ "+work:""),entries:[]});
    groups.get(key).entries.push(e);
  }
  return [...groups.values()];
}
function selectFamily(fam,requestedId){
  document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("active",b.dataset.f===fam));
  const meta=familyMeta(fam);$("#familyTitle").textContent=meta?.label_zh||fam;
  const es=entries.filter(e=>e.family===fam),groups=familyGroups(es,fam);
  $("#groups").innerHTML=groups.length?groups.map(g=>'<div><div class="muted" style="margin:12px 0 5px">'+escapeText(g.label)+'</div>'+g.entries.map(e=>'<button class="pill" data-id="'+escapeText(e.class_id)+'">'+escapeText(e.label_zh)+'</button>').join("")+'</div>').join(""):'<div class="empty">尚無已發布建模成果</div>';
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>selectEntry(b.dataset.id));
  if(es[0])selectEntry(es.find(e=>e.class_id===requestedId)?.class_id||es[0].class_id);else{selected=assets=null;render()}
}
async function selectEntry(id){
  const entry=entries.find(e=>e.class_id===id);if(!entry)return;
  selected=entry;view=0;variantIndex=0;assets=galleryAssets[id];
  const fragment="class="+encodeURIComponent(id);if(window.location.hash.slice(1)!==fragment)window.location.hash=fragment;
  document.querySelectorAll("[data-id]").forEach(b=>b.classList.toggle("active",b.dataset.id===id));render();
}
// ---- generic Golden Class asset normaliser -------------------------------
// Bridge manifests are single-variant (`assets` + `display_order`); road
// manifests are multi-variant (`variants[].views[]`). Normalising both here
// keeps ONE gallery UI for every Golden Class family instead of a second site.
function assetVariants(manifest){
  if(!manifest) return [];
  if(manifest.variants) return manifest.variants.map(v=>({
    variant:v.variant, parameters:v.parameters, views:(v.views||[]).map(x=>({
      role:x.role, purpose:x.purpose,
      url:x.public_url||x.secure_url||null,
      publicUrl:!!x.public_url, bytes:x.bytes, format:x.format||null
    }))
  }));
  const order=manifest.display_order||[], rank=new Map(order.map((r,i)=>[r,i]));
  const items=(manifest.assets||[]).map(x=>({
    role:x.role, purpose:x.purpose, url:x.secure_url||x.public_url||null,
    publicUrl:!!x.secure_url, bytes:x.bytes, format:x.format||null
  })).sort((a,b)=>(rank.get(a.role)??9999)-(rank.get(b.role)??9999));
  return items.length?[{variant:manifest.visual_qa_revision||"default", parameters:null, views:items}]:[];
}
function viewGroup(x){
  return (x?.format==="svg" || String(x?.role||"").startsWith("engineering_"))
    ? "engineering" : "visual";
}
function groupedThumbs(views,current){
  const groups=[["visual","3D Visual QA"],["engineering","Engineering SVG"]];
  return groups.map(([kind,label])=>{
    const members=views.map((x,n)=>({x,n})).filter(o=>viewGroup(o.x)===kind);
    if(!members.length) return "";
    return '<div class="view-group" data-view-group="'+kind+'">'
      +'<div class="muted" style="font-weight:700;margin:14px 0 8px">'+label+'</div>'
      +'<div class="thumbs">'
      +members.map(({x,n})=>{
        const image={url:escapeText(x.url),role:escapeText(x.role)};
        return '<button type="button" class="thumb '+(n===current?"active":"")+'" data-v="'+n+'" aria-label="'+image.role+'">'
          +'<img src="'+image.url+'" loading="lazy" alt="'+image.role+'">'
          +'<small>'+image.role+'</small></button>';
      }).join("")
      +'</div></div>';
  }).join("");
}
function selectVariant(i){variantIndex=i;view=0;render()}
function keyValues(rows){return '<div class="kv">'+rows.map(([label,value])=>'<span class="muted">'+escapeText(label)+'</span><b>'+escapeText(value??"未提供")+'</b>').join("")+'</div>'}
function provenanceLink(label,url){
  try{const parsed=new URL(url);if(parsed.protocol!=="https:"||parsed.href.split("/")[2].includes("@"))return ""}
  catch{return ""}
  return '<a class="entry-link" href="'+escapeText(url)+'" target="_blank" rel="noopener noreferrer">'+escapeText(label)+'</a>';
}
function characterInfo(entry,manifest,viewCount){
  const value=field=>manifest?.[field]??entry?.[field]??"未提供";
  const evidence=manifest?.asset_license_evidence||entry?.asset_license_evidence||{};
  const links=[provenanceLink("模型來源",manifest?.source_url||entry?.source_url||evidence.source_url),provenanceLink("授權證據",manifest?.license_url||entry?.license_url||evidence.license_url)].filter(Boolean).join(" · ");
  return '<h2>'+escapeText(entry.label_zh)+'</h2><p>'+escapeText(value("label_en"))+'</p>'+keyValues([
    ["來源作品",value("source_work")],["Class",entry.class_id],["Status",entry.status??manifest?.status??"未提供"],
    ["Source format",value("source_format")],["Geometry",value("geometry_status")],["Runtime",value("runtime_status")],
    ["Material",value("material_status")],["Skin",value("skin_status")],["Animation",value("animation_status")],
    ["Source clips",value("source_animation_count")],["Benchmark clip",value("authored_benchmark_clip")],
    ["License",value("license_status")],["Asset license",value("asset_license")],["Views",viewCount],
  ])+(links?'<p>'+links+'</p>':"")+'<p><a class="entry-link" href="#class='+encodeURIComponent(entry.class_id)+'">此角色成果連結</a></p>';
}
function animationPreviewAssets(manifest){
  const rank=new Map([["clip_start",0],["clip_middle",1],["clip_end",2]]);
  return (manifest.animation_previews||[]).map(x=>({...x,role:x.role||x.id,url:x.secure_url||x.public_url})).sort((a,b)=>(rank.get(a.role)??99)-(rank.get(b.role)??99));
}
function animationPreviewMarkup(manifest){
  const frames=animationPreviewAssets(manifest);if(!frames.length)return "";
  return '<section id="animationPreviews"><h3>Animation Preview</h3><p class="muted">Clip: '+escapeText(manifest.animation_clip||"未提供")+' · '+escapeText(manifest.authored_benchmark_clip?"SceneX authored benchmark clip":"來源動畫預覽")+'</p><div class="thumbs">'+frames.map((x,n)=>{
    const image={url:escapeText(x.url),role:escapeText(x.role)};
    return '<button type="button" class="preview-card" data-preview="'+n+'"><img class="preview-image" src="'+image.url+'" alt="'+image.role+'"><small>'+image.role+' · t='+escapeText(x.normalized_progress??"未提供")+'</small></button>';
  }).join("")+'</div></section>';
}
function videoPreviewMarkup(manifest){
  const videos=(manifest.videos||[]).filter(x=>x.secure_url||x.public_url);
  if(!videos.length)return "";
  return '<section id="videoPreviews"><h3>Video</h3>'+videos.map(x=>'<div style="margin:12px 0"><video controls playsinline preload="metadata" style="display:block;width:100%;max-height:62vh;background:#090c10;border-radius:8px" src="'+escapeText(x.secure_url||x.public_url)+'"></video><small>'+escapeText(x.title_zh||x.role||"animation")+' · '+escapeText(x.motion_status||"")+'</small></div>').join("")+'</section>';
}
function rigQAMarkup(manifest){
  const qa=manifest.rig_qa;if(!qa)return "";
  const frames=[qa.rest,qa.pose].filter(x=>x&&(x.secure_url||x.public_url));if(!frames.length)return "";
  const metrics=qa.rest?.mae!==undefined?' · Rest MAE '+escapeText(qa.rest.mae):'';
  return '<section id="rigQA"><h3>Rig QA</h3><p class="muted">'+escapeText(qa.revision||"semantic rig")+metrics+'</p><div class="thumbs">'+frames.map((x,n)=>'<button type="button" class="preview-card" data-rigqa="'+n+'"><img class="preview-image" src="'+escapeText(x.secure_url||x.public_url)+'" alt="'+escapeText(x.role||"rig_qa")+'"><small>'+escapeText(x.label||x.role||"rig_qa")+'</small></button>').join("")+'</div></section>';
}
function openImage(asset){
  const dialog=$("#imageLightbox");$("#lightboxImage").src=asset.url;$("#lightboxImage").alt=asset.role;
  $("#lightboxCaption").textContent=(selected?.label_zh||"")+" · "+asset.role;dialog.showModal();
}
function render(){
  const character=isCharacterEntry(selected);
  if(!assets){
    $("#stage").innerHTML='<div class="empty"><div><b>'+escapeText(selected?.label_zh||"百科條目")+'</b><br><span class="muted">Executable Class 已建立 · 視覺成果待發布</span></div></div>';
    $("#info").innerHTML=character?characterInfo(selected,null,0):'<h2>'+escapeText(selected?.label_zh||"—")+'</h2>'+keyValues([["Class",selected?.class_id],["狀態",selected?.status],["Source",selected?.class_path]])+'<p class="muted">此入口已納入百科；production geometry / visual QA 圖片完成發布後會直接顯示於此。</p>';
    return;
  }
  const vv=assetVariants(assets);
  if(!vv.length){$("#stage").innerHTML='<div class="empty">此 Class 尚無已發布視覺成果</div>';$("#info").innerHTML=character?characterInfo(selected,assets,0):'<h2>'+escapeText(selected.label_zh)+'</h2>';return}
  if(variantIndex>=vv.length)variantIndex=0;
  const cur=vv[variantIndex],aa=cur.views,a=aa[view]||aa[0];
  const image={url:escapeText(a.url),role:escapeText(a.role)};
  $("#stage").innerHTML='<button type="button" class="hero-button" aria-label="開啟大圖"><img class="hero" src="'+image.url+'" alt="'+image.role+'" data-role="'+image.role+'"></button>'+groupedThumbs(aa,view);
  $(".hero-button").onclick=()=>openImage(a);
  document.querySelectorAll("[data-v]").forEach(e=>e.onclick=()=>{view=+e.dataset.v;render()});
  const varBar=vv.length>1?'<div class="bar" style="padding:8px 0">'+vv.map((x,n)=>'<button class="pill '+(n===variantIndex?'active':'')+'" data-var="'+n+'">'+escapeText(x.variant)+'</button>').join('')+'</div>':'';
  $("#stage").insertAdjacentHTML("beforeend",varBar);
  document.querySelectorAll("[data-var]").forEach(e=>e.onclick=()=>selectVariant(+e.dataset.var));
  if(character){
    $("#stage").insertAdjacentHTML("beforeend",rigQAMarkup(assets)+animationPreviewMarkup(assets)+videoPreviewMarkup(assets));
    const qaFrames=[assets.rig_qa?.rest,assets.rig_qa?.pose].filter(Boolean).map(x=>({url:x.secure_url||x.public_url,role:x.role||"rig_qa"}));
    document.querySelectorAll("[data-rigqa]").forEach(e=>e.onclick=()=>openImage(qaFrames[+e.dataset.rigqa]));
    const previews=animationPreviewAssets(assets);document.querySelectorAll("[data-preview]").forEach(e=>e.onclick=()=>openImage(previews[+e.dataset.preview]));
    $("#info").innerHTML=characterInfo(selected,assets,aa.length);return;
  }
  const pj=cur.parameters?Object.entries(cur.parameters).filter(([k,v])=>v!==null&&v!==undefined).slice(0,14).map(([k,v])=>'<li>'+escapeText(k)+' = '+escapeText(Array.isArray(v)?JSON.stringify(v):v)+'</li>').join(''):'';
  const un=(selected?.unresolved_items||[]).length,unTxt=un?un+' 項（缺工程 authority，不猜測）':'無';
  $("#info").innerHTML='<h2>'+escapeText(selected.label_zh)+'</h2>'+keyValues([
    ["Class",assets.class_id],["Version",assets.class_version],["View",a.role],["Variant",cur.variant],
    ["View 來源",a.publicUrl?'public URL':'local render'],["Views",aa.length],["IFC",selected?.ifc_predefined_type||"—"],
    ["Dual Tree",selected?.dual_tree_status||"—"],["Sensitivity",selected?.sensitivity_status||"—"],
    ["參數數",selected?.parameter_count??"—"],["UNRESOLVED",unTxt],["Revision",assets.visual_qa_revision||"—"],
    ["Commit",(assets.generated_from_commit||"—").slice(0,8)],["成果排序",(assets.display_order||[]).join(" · ")],
  ])+'<h3>Variant 參數</h3><ul>'+(pj||'<li>—</li>')+'</ul><h3>建模特徵</h3><ul>'+(assets.construction_features||[]).map(x=>'<li>'+escapeText(x)+'</li>').join("")+'</ul><p class="muted">圖片是衍生 QA；Python Class / geometry provider 為建模 authority。</p>';
}
window.addEventListener("hashchange",()=>{const target=hashEntry();if(target&&target.class_id!==selected?.class_id)selectFamily(target.family,target.class_id)});
$("#closeLightbox").onclick=()=>$("#imageLightbox").close();
$("#imageLightbox").addEventListener("click",e=>{if(e.target===$("#imageLightbox"))$("#imageLightbox").close()});
boot().catch(e=>{$("#stage").innerHTML='<div class="empty">Gallery 載入失敗：'+escapeText(e.message)+'</div>'})
</script></body></html>
